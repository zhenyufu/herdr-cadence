id = "herdr-cadence"
name = "Cadence"
version = "0.4.1"
min_herdr_version = "0.7.5"
description = "Orchestrate Claude Code, Codex, and OpenCode agents in shared or isolated Git checkouts"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install-release.sh"]

[[startup]]
command = ["bin/herdr-cadence", "startup"]

[[actions]]
id = "init"
title = "Cadence: Initialize project"
description = "Create .cadence.toml in the current Git repository"
contexts = ["workspace"]
command = ["bin/herdr-cadence", "action", "init"]

[[actions]]
id = "disable-project"
title = "Cadence: Disable project"
description = "Disable Cadence while preserving its project configuration"
contexts = ["workspace"]
command = ["bin/herdr-cadence", "action", "disable-project"]

[[actions]]
id = "start"
title = "Cadence: Start Lead"
description = "Start or focus this project's Lead"
contexts = ["workspace"]
command = ["bin/herdr-cadence", "action", "start"]

[[actions]]
id = "status"
title = "Cadence: Status"
description = "Print this project's active run and Agent status"
contexts = ["workspace"]
command = ["bin/herdr-cadence", "action", "status"]

[[actions]]
id = "validate-config"
title = "Cadence: Validate Config"
description = "Validate and print this project's resolved Cadence configuration"
contexts = ["workspace"]
command = ["bin/herdr-cadence", "action", "validate-config"]

[[events]]
on = "pane.agent_status_changed"
command = ["bin/herdr-cadence", "event"]

[[events]]
on = "pane.agent_detected"
command = ["bin/herdr-cadence", "event"]

[[events]]
on = "pane.exited"
command = ["bin/herdr-cadence", "event"]
